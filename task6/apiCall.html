<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1></h1>
</body>
<script>
    let url = "https://catfact.ninja/fact";
    let h1 = document.querySelector("h1");
    fetch(url)
    .then((res) => {
        return res.json();
    })
    .then((data) => {
        console.log("data = ", data.fact);
        h1.innerText = data.fact;
    })
</script>
</html>
